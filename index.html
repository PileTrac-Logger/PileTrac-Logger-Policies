<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PileTrac Logger - App Documentation</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Modern CSS Reset & Core Tokens */
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 0;
            overflow-x: hidden;
        }

        /* Hero Header Section */
        header {
            position: relative;
            padding: 5rem 1.5rem 3rem;
            text-align: center;
            background: radial-gradient(circle at top, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .app-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(120deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Container & Cards Layout */
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 1.5rem 6rem;
        }

        /* Policy Section Content */
        .section-block {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        /* Style the bold "subheadings" inside paragraphs */
        .section-block p strong {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            margin-top: 2rem;
            color: #ffffff;
            border-left: 4px solid var(--accent-primary);
            padding-left: 0.75rem;
        }
        
        h2:first-child {
            margin-top: 0;
        }

        ul.guide-list {
            margin-left: 1.5rem;
            margin-bottom: 1.75rem;
            list-style: disc;
        }

        ol.guide-list {
            margin-left: 1.5rem;
            margin-bottom: 1.75rem;
            list-style: decimal;
        }

        .guide-list > li {
            margin-bottom: 0.85rem;
            line-height: 1.7;
            padding-left: 0;
            position: static;
        }

        .guide-list > li::before {
            content: none;
        }
            
        p {
            margin-bottom: 1.25rem;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        ul {
            list-style-type: none;
            margin-bottom: 1.25rem;
            padding-left: 0.5rem;
        }

        li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            font-size: 1.05rem;
        }

        li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--accent-primary);
            font-weight: bold;
        }

        /* Action Buttons */
        .actions-panel {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-speed);
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            background-color: #080c14;
        }

        /* Print Media Styles */
        @media print {
            body {
                background-color: #ffffff;
                color: #000000;
                font-size: 12pt;
            }
            header {
                background: none;
                border-bottom: 2px solid #000000;
                padding-top: 1rem;
            }
            h1 {
                background: none;
                -webkit-text-fill-color: initial;
                color: #000000;
            }
            .subtitle {
                color: #555555;
            }
            .quick-facts, .actions-panel {
                display: none;
            }
            .section-block {
                background-color: #ffffff;
                border: none;
                box-shadow: none;
                padding: 1rem 0;
                margin-bottom: 1rem;
                page-break-inside: avoid;
            }
            h2 {
                color: #000000;
                border-left: 3px solid #000000;
            }
            p, li {
                color: #333333;
            }
            li::before {
                color: #000000;
            }
            footer {
                background: none;
                border-top: 1px solid #000000;
                color: #555555;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="app-badge">PTL</div>
            <h1 id="policy-title">PileTrac Logger</h1>
            <p class="subtitle">App Documentation</p>
        </div>
    </header>

    <main>
        <article class="section-block">
            <p style="text-align:center;"><strong>Support</strong></p>
            <p>If you have any questions regarding the app, please contact us at <a href="mailto:info@ftandc.com" style ="color: var(--accent-primary); text-decoration: non;">info@ftandc.com</a></p>
        </article>
        
        <article class="section-block">
            <p style="text-align:center;"><strong>App - Legal & User Documentation</strong></p>

<ul class="guide-list">  
    <li><a href="eula.html"> 📄 End User Llicense Agreement (EULA)</a></li>
    <li><a href="privacy.html"> 🔒 Privacy Policy</a></li>
    <li><a href="user_guide.html"> 📘 User Guide</a></li>
</ul>

        </article>
    </main>

    <footer>
        <p>&copy; 2026 PileTrac Logger. All rights reserved.</p>
    </footer>

</body>
</html>
